# golangci-lint 配置
# 文档：https://golangci-lint.run/usage/configuration/
run:
  timeout: 10m
  modules-download-mode: readonly

linters:
  enable:
    # 基础检查
    - govet          # 类型安全、结构体标签、printf 格式
    - errcheck       # 未检查的 error 返回值
    - staticcheck    # 综合静态分析（覆盖大部分 SA* 规则）
    - unused         # 未使用的变量/函数/类型
    - gosimple       # 可简化的代码模式
    - ineffassign    # 无效赋值

    # 安全/健壮性
    - bodyclose      # HTTP response body 未关闭
    - nilerr         # 返回 nil 但 error 非 nil
    - contextcheck   # context 传播检查

    # 风格（保守选型，避免与 gofmt 冲突）
    - gofmt          # 格式化
    - goimports      # import 排序
    - misspell       # 英文拼写错误

linters-settings:
  errcheck:
    check-blank: false           # 不检查 _ = err 这种显式忽略
    exclude-functions:
      - (io.Closer).Close        # defer Close() 的常见模式
      - (net.Listener).Close

  govet:
    enable-all: true
    disable:
      - fieldalignment            # 结构体内存对齐（性能优化项，非必须）

  staticcheck:
    checks:
      - all                       # 启用所有 SA 规则

issues:
  exclude-rules:
    # 测试文件放宽限制
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
        - contextcheck

    # protobuf 生成的代码不检查
    - path: \.pb\.go$
      linters:
        - errcheck
        - unused
        - govet

    # 配置/常量文件中的硬编码字符串是正常的
    - path: config/
      text: "hardcoded"

  max-issues-per-linter: 50
  max-same-issues: 10
